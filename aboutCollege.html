<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>About College</title>
    <link rel="stylesheet" type="text/css" href="style.css">
    <link rel="stylesheet" href="portal.css">
</head>

<body>

    <nav class="portal-topbar" aria-label="Main navigation">
        <a class="portal-brand" href="http://localhost:3000/index.html">
            <span class="brand-mark">C</span>
            <span class="brand-name">CCD <small>PORTAL</small></span>
        </a>
        <div class="portal-nav-links">
            <a href="http://localhost:4000/">Search</a>
            <a href="http://localhost:3000/">Students</a>
            <a href="http://localhost:5000/">Instructors</a>
            <a class="is-current" href="http://localhost:3000/aboutCollege.html">Departments</a>
        </div>
        <a class="portal-home-link" href="http://localhost:3000/index.html">Workspace <span aria-hidden="true">↗</span></a>
    </nav>

    <main class="department-page">
        <header class="department-heading">
            <p class="eyebrow">ACADEMIC DIRECTORY</p>
            <h1>College-Department Structure</h1>
            <p>Explore each department and the courses it offers.</p>
        </header>
        <section class="department-panel" aria-label="Department tree">
            <div class="tree-toolbar">
                <p id="tree-summary" class="tree-summary" aria-live="polite">Loading departments…</p>
                <button id="tree-toggle" class="tree-toggle" type="button" hidden>Collapse all</button>
            </div>
            <div id="tree-container" aria-live="polite">
                <p class="tree-message">Loading the college structure…</p>
            </div>
        </section>
        <noscript>
            <p class="tree-message tree-error">Enable JavaScript to view the department structure.</p>
        </noscript>
    </main>
    <script src="tree.js"></script>

</body>

</html>
