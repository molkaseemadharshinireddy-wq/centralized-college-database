<!DOCTYPE html>
<html>
<head>
  <title>Add/Delete Instructor</title>
  <style>
    html {
height: 100%;
}
body {
margin:0;
padding:0;
font-family: sans-serif;
background: white
}

.but1{
  background-color: Transparent;
  border: none;
}

.login-box {
position: absolute;
top: 50%;
left: 50%;
width: 400px;
padding: 40px;
transform: translate(-50%, -50%);
background: rgba(0, 0, 31, 0.863);
box-sizing: border-box;
box-shadow: 0 15px 25px rgba(0,0,0,.6);
border-radius: 10px;
}

.login-box h2 {
margin: 0 0 30px;
padding: 0;
color: #fff;
text-align: center;
}

.login-box .user-box {
position: relative;
}

.login-box .user-box input {
width: 100%;
padding: 10px 0;
font-size: 16px;
color: #fff;
margin-bottom: 30px;
border: none;
border-bottom: 1px solid #fff;
outline: none;
background: transparent;
}
.login-box .user-box select {
width: 100%;
padding: 10px 0;
margin-bottom: 30px;
color: #fff;
border: none;
border-bottom: 1px solid #fff;
outline: none;
background: transparent;
}
.login-box .user-box select option {
color: #000;
}
.login-box .user-box label {
position: absolute;
top:0;
left: 0;
padding: 10px 0;
font-size: 16px;
color: #fff;
pointer-events: none;
transition: .5s;
}

.login-box .user-box input:focus ~ label,
.login-box .user-box input:valid ~ label {
top: -20px;
left: 0;
color: #03e9f4;
font-size: 12px;
}

.login-box form button {
position: relative;
display: inline-block;
padding: 10px 20px;
color: #03e9f4;
font-size: 16px;
text-decoration: none;
text-transform: uppercase;
overflow: hidden;
transition: .5s;
margin-top: 40px;
letter-spacing: 4px
}

.login-box button:hover {
background: #03e9f4;
color: #fff;
border-radius: 5px;
box-shadow: 0 0 5px #03e9f4,
          0 0 25px #03e9f4,
          0 0 50px #03e9f4,
          0 0 100px #03e9f4;
}

.login-box button span {
position: absolute;
display: block;
}

.login-box button span:nth-child(1) {
top: 0;
left: -100%;
width: 100%;
height: 2px;
background: linear-gradient(90deg, transparent, #03e9f4);
animation: btn-anim1 1s linear infinite;
}

@keyframes btn-anim1 {
0% {
left: -100%;
}
50%,100% {
left: 100%;
}
}

.login-box button span:nth-child(2) {
top: -100%;
right: 0;
width: 2px;
height: 100%;
background: linear-gradient(180deg, transparent, #03e9f4);
animation: btn-anim2 1s linear infinite;
animation-delay: .25s
}

@keyframes btn-anim2 {
0% {
top: -100%;
}
50%,100% {
top: 100%;
}
}

.login-box button span:nth-child(3) {
bottom: 0;
right: -100%;
width: 100%;
height: 2px;
background: linear-gradient(270deg, transparent, #03e9f4);
animation: btn-anim3 1s linear infinite;
animation-delay: .5s
}

@keyframes btn-anim3 {
0% {
right: -100%;
}
50%,100% {
right: 100%;
}
}

.login-box button span:nth-child(4) {
bottom: -100%;
left: 0;
width: 2px;
height: 100%;
background: linear-gradient(360deg, transparent, #03e9f4);
animation: btn-anim4 1s linear infinite;
animation-delay: .75s
}

@keyframes btn-anim4 {
0% {
bottom: -100%;
}
50%,100% {
bottom: 100%;
}
}
</style>
</head>
<body>
  <div class="login-box" >

  <h2>Add/Delete Instructor</h2>
  <form action="/" method="POST">

    <div class="user-box">
    <input type="number" id="instructor_id" name="instructor_id" min="1" step="1" required><br>
    <label for="instructor_id">Instructor ID:</label>
  </div>

    <div class="user-box">
    <input type="text" id="instructor_name" name="instructor_name" maxlength="255"><br>
    <label for="instructor_name">Instructor Name:</label>
  </div>

    <div class="user-box">
    <select id="department_id" name="department_id" disabled>
      <option value="">Loading departments...</option>
    </select>
    <!-- <label for="department_id">Department:</label> -->
  </div>
    
    <button id="add-instructor" class="but1" type="submit" name="action" value="add" disabled>Add
      <span></span>
      <span></span>
      <span></span>
      <span></span>
    </button>
    <button class="but1" type="submit" name="action" value="delete">Delete
      <span></span>
      <span></span>
      <span></span>
      <span></span>
    </button>
  </form>

  <p id="form-message" role="status" aria-live="polite" style="color: white; text-align: center;"></p>
</div>

  <script>
    const form = document.querySelector('form');
    const departmentSelect = document.querySelector('#department_id');
    const instructorName = document.querySelector('#instructor_name');
    const addButton = document.querySelector('#add-instructor');
    const message = document.querySelector('#form-message');
    const apiBase = window.location.protocol === 'file:' ? 'http://localhost:5000' : '';

    fetch(`${apiBase}/departments`)
      .then(async response => {
        if (!response.ok) {
          throw new Error(await response.text());
        }
        return response.json();
      })
      .then(departments => {
        departmentSelect.replaceChildren(new Option('--Select Department--', ''));
        for (const department of departments) {
          departmentSelect.add(new Option(
            `${department.department_name} (ID: ${department.department_id})`,
            department.department_id
          ));
        }
        departmentSelect.disabled = departments.length === 0;
        addButton.disabled = departments.length === 0;
        if (departments.length === 0) {
          departmentSelect.replaceChildren(new Option('No departments available', ''));
        }
      })
      .catch(error => {
        console.error('Could not load departments:', error);
        departmentSelect.replaceChildren(new Option('Could not load departments', ''));
        message.textContent = 'Departments could not be loaded. Adding instructors is unavailable.';
      });

    form.addEventListener('click', event => {
      const button = event.target.closest('button');
      const action = button ? button.value : '';
      if (action === 'add') {
        instructorName.required = true;
        departmentSelect.required = true;
      } else if (action === 'delete') {
        instructorName.required = false;
        departmentSelect.required = false;
      }
    });

    form.addEventListener('submit', async event => {
      event.preventDefault();
      message.textContent = '';
      const formData = new FormData(form);
      if (event.submitter && event.submitter.name) {
        formData.set(event.submitter.name, event.submitter.value);
      }
      try {
        const response = await fetch(`${apiBase}/`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
          body: new URLSearchParams(formData)
        });
        const result = await response.text();
        if (!response.ok) {
          throw new Error(result);
        }
        message.textContent = result || 'Request completed successfully.';
        message.style.color = '#03e9f4';
        if (formData.get('action') === 'add') {
          form.reset();
          departmentSelect.selectedIndex = 0;
        }
      } catch (error) {
        message.textContent = error.message || 'Request failed. Please try again.';
        message.style.color = '#ff8080';
      }
    });
  </script>
</body>
</html>
